aid: riff
name: Riff
description: 'Riff is an Oslo, Norway based enterprise software company building AI
  agents for supply chain, procurement, planning, and logistics operations. Its agents
  automate repetitive back-office work such as chasing supplier order confirmations,
  updating order and delivery status, matching invoices, and monitoring deliveries,
  while keeping actions deterministic, auditable, and team-controlled rather than
  purely generative. Riff integrates non-disruptively with existing ERP systems including
  SAP, Oracle, Infor, and Microsoft, is EU-based with SOC 2 and ISO 27001 aligned
  and GDPR compliant data handling, and was founded by veterans of Cognite. The company
  raised a $16M Series A backed by Northzone and other investors. Riff has no public
  developer or API program at this time; this profile is maintained in the API Evangelist
  network as a company record.'
